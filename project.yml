# Xcode project used only for UI tests (XCUITest needs an app target).
# Regenerate with: xcodegen generate
name: SendbayUI
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  Sendbay:
    path: .
targets:
  SendbayApp:
    type: application
    platform: macOS
    sources:
      - Sources/Sendbay
      - Resources/Assets.xcassets
    dependencies:
      - package: Sendbay
        product: MTPKit
      - package: Sendbay
        product: SendbayUSB
    settings:
      base:
        PRODUCT_NAME: Sendbay
        PRODUCT_BUNDLE_IDENTIFIER: com.hariantara.sendbay.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        LIBRARY_SEARCH_PATHS: /opt/homebrew/opt/libusb/lib
  SendbayUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: SendbayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hariantara.sendbay.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: SendbayApp
schemes:
  SendbayApp:
    build:
      targets:
        SendbayApp: all
        SendbayUITests: [test]
    test:
      targets: [SendbayUITests]
